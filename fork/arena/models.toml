# Ein Eintrag pro getesteter KI. path = Glob unter ~/.cache/huggingface/hub, flags = zusätzliche ft-serve-Flags,
# caps = Fähigkeiten (vision = Bildeingabe), worktree = welcher FreeToken-Stand den Server stellt
# (Standard ~/claude/ft-speed-wt = Branch next-speed).
# "--model all" lässt alle Einträge mit skip = true aus. removed = "Grund" streicht ein Modell ganz (kein Lauf, nicht
# auf der Seite). Jedes Modell braucht mindestens 80k Kontext (MIN_CONTEXT in run.py), sonst bricht der Lauf ab.

[qwen3-0_6b]
label = "Qwen3 0.6B"
group = "Klein (dicht)"
path = "models--Qwen--Qwen3-0.6B/snapshots/*"
# YaRN x4 wie in der Qwen3-Modellkarte: 40k -> 131k Kontext
flags = '''--kv-cache-dtype fp8 --hf-overrides '{"rope_scaling":{"rope_type":"yarn","factor":4.0,"original_max_position_embeddings":32768},"max_position_embeddings":131072}''''

[llama3_2-1b]
label = "Llama 3.2 1B Instruct"
group = "Klein (dicht)"
path = "models--unsloth--Llama-3.2-1B-Instruct/snapshots/*"
flags = "--kv-cache-dtype fp8"

[qwen2_5-1_5b]
label = "Qwen2.5 1.5B Instruct"
group = "Klein (dicht)"
path = "models--Qwen--Qwen2.5-1.5B-Instruct/snapshots/*"
flags = "--kv-cache-dtype fp8"
removed = "nur 32k Kontext (Modellgrenze)"

[gemma4-e2b]
label = "Gemma 4 E2B"
group = "Klein (dicht)"
path = "models--google--gemma-4-E2B-it/snapshots/*"
flags = "--kv-cache-dtype fp8 --text-model-only"  # #467-Vision lehnt E2B/E4B ab (clipped linears)

[gemma4-e4b]
label = "Gemma 4 E4B"
group = "Klein (dicht)"
path = "models--google--gemma-4-E4B-it/snapshots/*"
flags = "--kv-cache-dtype fp8 --text-model-only"  # #467-Vision lehnt E2B/E4B ab (clipped linears)

[mistral-7b]
label = "Mistral 7B Instruct v0.3"
group = "Mittel (dicht)"
path = "models--mistralai--Mistral-7B-Instruct-v0.3/snapshots/*"
flags = "--kv-cache-dtype fp8"
removed = "nur 32k Kontext (Modellgrenze)"

[qwen3-vl-8b]
label = "Qwen3-VL 8B Instruct"
group = "Mittel (dicht)"
path = "models--Qwen--Qwen3-VL-8B-Instruct/snapshots/*"
flags = "--kv-cache-dtype fp8"
caps = ["vision"]

[gemma4-12b-qat]
label = "Gemma 4 12B (QAT Q4_0 GGUF)"
group = "Mittel (dicht)"
path = "models--google--gemma-4-12B-it-qat-q4_0-gguf/snapshots/*/*.gguf"
flags = "--kv-cache-dtype fp8"

[gpt-oss-20b]
label = "gpt-oss 20B"
group = "MoE"
path = "models--openai--gpt-oss-20b/snapshots/*"
flags = "--kv-cache-dtype fp8"

[gemma4-26b-a4b]
label = "Gemma 4 26B-A4B (NVFP4)"
group = "MoE"
path = "models--nvidia--Gemma-4-26B-A4B-NVFP4/snapshots/*"
flags = "--kv-cache-dtype fp8 --text-model-only"

[qwen3-30b-a3b]
label = "Qwen3 30B-A3B (Q4_K_M GGUF)"
group = "MoE"
path = "models--Qwen--Qwen3-30B-A3B-GGUF/snapshots/*/*.gguf"
# YaRN x4 (Qwen3-Modellkarte) braucht den GGUF-YaRN-Support (next 2026-10-15); 100k KV reserviert, ~80% der Experten im VRAM
flags = '''--kv-cache-dtype fp8 --max-running-requests 1 --kv-reserve-tokens 100000 --hf-overrides '{"rope_scaling":{"rope_type":"yarn","factor":4.0,"original_max_position_embeddings":32768},"max_position_embeddings":131072}''''

[qwen3_6-35b-a3b]
label = "Qwen3.6 35B-A3B (NVFP4)"
group = "MoE"
path = "models--RedHatAI--Qwen3.6-35B-A3B-NVFP4/snapshots/*"
flags = "--kv-cache-dtype fp8 --text-model-only"

[qwen3_6-35b-a3b-dflash]
label = "Qwen3.6 35B-A3B (NVFP4 + DFlash)"
group = "MoE"
path = "models--RedHatAI--Qwen3.6-35B-A3B-NVFP4/snapshots/*"
flags = "--kv-cache-dtype fp8 --text-model-only --speculative-algorithm dflash --speculative-draft-model-path /home/basti/.cache/huggingface/hub/models--z-lab--Qwen3.6-35B-A3B-DFlash/snapshots/f181eece646affea2c38b2765f1aaa01a9734ccd --speculative-draft-quant fp8"

[muse-glimmer-30b]
label = "Muse Glimmer 30B (NVFP4)"
group = "Groß (dicht)"
path = "models--RedHatAI--Muse-Glimmer-30B-NVFP4/snapshots/*"
# mit Vision-Teil OOM beim nvfp4-Finalize (Preflight sagt trotzdem "fits"); text-only: 131k Kontext
flags = "--kv-cache-dtype fp8 --text-model-only --embed-device cpu --max-running-requests 1 --max-prefill-length 4096"

[qwen3_8-27b]
label = "Qwen3.8 27B (NVFP4)"
group = "Groß (dicht)"
path = "models--RadixArk--Qwen3.8-27B-NVFP4/snapshots/*"
flags = "--kv-cache-dtype fp8 --text-model-only --memory-ratio 0.95 --embed-device cpu --max-running-requests 1 --max-prefill-length 4096"  # 99.5k Kontext (nvfp4-KV: ~190k, langsamer)

[qwen3_8-27b-dflash]
label = "Qwen3.8 27B (NVFP4 + DFlash)"
group = "Groß (dicht)"
path = "models--RadixArk--Qwen3.8-27B-NVFP4/snapshots/*"
# Draft-Modell braucht VRAM: nur mit nvfp4-KV, 1 Anfrage, kleinen Prefill-Blöcken ~81k Kontext (Prognose)
flags = "--kv-cache-dtype nvfp4 --text-model-only --memory-ratio 0.97 --embed-device cpu --max-running-requests 1 --max-prefill-length 2048 --cuda-graph-max-bs 1 --speculative-algorithm dflash --speculative-draft-model-path /home/basti/.cache/huggingface/hub/models--z-lab--Qwen3.8-27B-DFlash2/snapshots/50307d4c4cde6860d4eee73e2547cd786fe8e8a4 --speculative-draft-quant fp8"

[glm4_5-air]
label = "GLM-4.5-Air (NVFP4)"
group = "MoE (Offload)"
path = "models--gesong2077--GLM-4.5-Air-NVFP4/snapshots/*"
# Experten (52 GiB) ganz im RAM; ohne Reserve nur 12k Kontext, 85k KV lassen ~400 Expert-Slots im VRAM
flags = "--kv-cache-dtype fp8 --max-running-requests 1 --kv-reserve-tokens 85000"

[qwen3_8-flash-next]
label = "Qwen3.8 Flash-Next (NVFP4)"
group = "MoE (Offload)"
path = "models--RadixArk--Qwen3.8-Flash-Next-NVFP4/snapshots/*"
flags = "--kv-cache-dtype fp8 --text-model-only --ple-backend disk --cuda-graph-max-bs 1"
# alle Experten im RAM: Peak ~65 GiB RSS (2026-10-07 bei 79 GiB RAM), ~101k Kontext dank --kv-reserve-share
