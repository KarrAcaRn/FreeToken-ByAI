# Ein Eintrag pro getesteter KI. path = Glob unter ~/.cache/huggingface/hub, flags = zusätzliche ft-serve-Flags,
# caps = Fähigkeiten (vision = Bildeingabe), think_format = wie das Modell sein Denken schreibt (think = <think>,
# harmony = gpt-oss, gemma4; nötig, um das Denken nach Ablauf der Denkzeit abzubrechen), tempo = "langsam" / "schnell"
# legt die Zeitklasse fest statt sie zu messen (README: Zeitlimits), worktree = welcher FreeToken-Stand den Server stellt
# (Standard ~/claude/ft-speed-wt = Branch next-speed), reasoning_effort = Denkstufe, die jede Anfrage mitschickt.
# "--model all" lässt alle Einträge mit skip = true aus. removed = "Grund" streicht ein Modell ganz (kein Lauf, nicht
# auf der Seite). Jedes Modell braucht mindestens 80k Kontext, langsame (< 35 tok/s) 40k (MIN_CONTEXT in run.py), sonst bricht der Lauf ab.

[qwen3-0_6b]
label = "Qwen3 0.6B"
group = "Klein (dicht)"
path = "models--Qwen--Qwen3-0.6B/snapshots/*"
# YaRN x4 wie in der Qwen3-Modellkarte: 40k -> 131k Kontext
flags = '''--kv-cache-dtype fp8 --hf-overrides '{"rope_scaling":{"rope_type":"yarn","factor":4.0,"original_max_position_embeddings":32768},"max_position_embeddings":131072}''''

[llama3_2-1b]
label = "Llama 3.2 1B Instruct"
group = "Klein (dicht)"
path = "models--unsloth--Llama-3.2-1B-Instruct/snapshots/*"
flags = "--kv-cache-dtype fp8"

[qwen2_5-1_5b]
label = "Qwen2.5 1.5B Instruct"
group = "Klein (dicht)"
path = "models--Qwen--Qwen2.5-1.5B-Instruct/snapshots/*"
flags = "--kv-cache-dtype fp8"
removed = "nur 32k Kontext (Modellgrenze)"

[gemma4-e2b]
label = "Gemma 4 E2B"
group = "Klein (dicht)"
path = "models--google--gemma-4-E2B-it/snapshots/*"
think_format = "gemma4"
flags = "--kv-cache-dtype fp8 --text-model-only"  # #467-Vision lehnt E2B/E4B ab (clipped linears)

[gemma4-e4b]
label = "Gemma 4 E4B"
group = "Klein (dicht)"
path = "models--google--gemma-4-E4B-it/snapshots/*"
think_format = "gemma4"
flags = "--kv-cache-dtype fp8 --text-model-only"  # #467-Vision lehnt E2B/E4B ab (clipped linears)

[mistral-7b]
label = "Mistral 7B Instruct v0.3"
group = "Mittel (dicht)"
path = "models--mistralai--Mistral-7B-Instruct-v0.3/snapshots/*"
flags = "--kv-cache-dtype fp8"
removed = "nur 32k Kontext (Modellgrenze)"

[qwen3-vl-8b]
label = "Qwen3-VL 8B Instruct"
group = "Mittel (dicht)"
path = "models--Qwen--Qwen3-VL-8B-Instruct/snapshots/*"
flags = "--kv-cache-dtype fp8"
caps = ["vision"]

[gemma4-12b-qat]
label = "Gemma 4 12B (QAT Q4_0 GGUF)"
group = "Mittel (dicht)"
path = "models--google--gemma-4-12B-it-qat-q4_0-gguf/snapshots/*/*.gguf"
think_format = "gemma4"
flags = "--kv-cache-dtype fp8"

[gpt-oss-20b]
# echt page: generation_config has no values; OpenAI model card: temperature 1.0, top_p 1.0
sampling = { temperature = 1.0, top_p = 1.0 }
label = "gpt-oss 20B"
group = "MoE"
path = "models--openai--gpt-oss-20b/snapshots/*"
think_format = "harmony"
flags = "--kv-cache-dtype fp8"

[flint-nvfp4]
# echt page: the GGUF has no generation_config; RecursiveSI/flint's: 1.0 / top_p 0.95 / top_k 20
sampling = { temperature = 1.0, top_p = 0.95, top_k = 20 }
label = "Flint 40B-A2.5B (NVFP4 GGUF)"
group = "MoE"
path = "models--RecursiveSI--flint-nvfp4-gguf/snapshots/*/flint-nvfp4.gguf"
# Messung 2026-10-23 (4090): offload/fp8 ~200-212 tok/s, dieses Rezept 220-228 bei 97k
# Kontext (mehr Expert-Slots), nvfp4-KV 154k aber -10 %, hybrid -5 %, ModelOpt-Export nur 133-141, Doku-Rezept 72-78
flags = "--kv-cache-dtype fp8 --max-running-requests 1 --embed-weights host --memory-ratio 0.95"

[gemma4-26b-a4b]
label = "Gemma 4 26B-A4B (NVFP4)"
group = "MoE"
path = "models--nvidia--Gemma-4-26B-A4B-NVFP4/snapshots/*"
think_format = "gemma4"
flags = "--kv-cache-dtype fp8 --text-model-only"

[qwen3-30b-a3b]
# echt page: the GGUF has no generation_config; Qwen3 card (thinking mode): 0.6 / top_k 20 / top_p 0.95
sampling = { temperature = 0.6, top_k = 20, top_p = 0.95 }
label = "Qwen3 30B-A3B (Q4_K_M GGUF)"
group = "MoE"
path = "models--Qwen--Qwen3-30B-A3B-GGUF/snapshots/*/*.gguf"
# YaRN x4 (Qwen3-Modellkarte) braucht den GGUF-YaRN-Support (next 2026-10-15); 100k KV reserviert, ~80% der Experten im VRAM
flags = '''--kv-cache-dtype fp8 --max-running-requests 1 --kv-reserve-tokens 100000 --hf-overrides '{"rope_scaling":{"rope_type":"yarn","factor":4.0,"original_max_position_embeddings":32768},"max_position_embeddings":131072}''''

[qwen3_6-35b-a3b]
label = "Qwen3.6 35B-A3B (NVFP4)"
group = "MoE"
path = "models--RedHatAI--Qwen3.6-35B-A3B-NVFP4/snapshots/*"
flags = "--kv-cache-dtype fp8 --text-model-only"

[qwen3_6-35b-a3b-dflash]
label = "Qwen3.6 35B-A3B (NVFP4 + DFlash)"
group = "MoE"
path = "models--RedHatAI--Qwen3.6-35B-A3B-NVFP4/snapshots/*"
flags = "--kv-cache-dtype fp8 --text-model-only --speculative-algorithm dflash --speculative-draft-model-path /home/basti/.cache/huggingface/hub/models--z-lab--Qwen3.6-35B-A3B-DFlash/snapshots/f181eece646affea2c38b2765f1aaa01a9734ccd --speculative-draft-quant fp8"

[muse-glimmer-30b]
label = "Muse Glimmer 30B (NVFP4)"
group = "Groß (dicht)"
path = "models--RedHatAI--Muse-Glimmer-30B-NVFP4/snapshots/*"
# Vision-Teil seit dem Encoder-vor-Finalize-Fix (next 2026-10-15) wieder an; 131k Kontext
flags = "--kv-cache-dtype fp8 --embed-weights host --max-running-requests 1 --max-prefill-length 4096"

[qwen3_8-27b]
label = "Qwen3.8 27B (NVFP4, Denken medium)"
group = "Groß (dicht)"
path = "models--RadixArk--Qwen3.8-27B-NVFP4/snapshots/*"
flags = "--kv-cache-dtype fp8 --text-model-only --memory-ratio 0.95 --embed-weights host --max-running-requests 1 --max-prefill-length 4096"  # 99.5k Kontext (nvfp4-KV: ~190k, langsamer)
reasoning_effort = "medium"  # Template-Standard ist xhigh (sehr lange Denkphasen); low / medium / xhigh

[qwen3_8-27b-dflash]
label = "Qwen3.8 27B (NVFP4 + DFlash, Denken medium)"
group = "Groß (dicht)"
path = "models--RadixArk--Qwen3.8-27B-NVFP4/snapshots/*"
# Draft-Modell braucht VRAM: nur mit nvfp4-KV, 1 Anfrage, kleinen Prefill-Blöcken ~81k Kontext (Prognose)
flags = "--kv-cache-dtype nvfp4 --text-model-only --memory-ratio 0.97 --embed-weights host --max-running-requests 1 --max-prefill-length 2048 --cuda-graph-max-bs 1 --speculative-algorithm dflash --speculative-draft-model-path /home/basti/.cache/huggingface/hub/models--z-lab--Qwen3.8-27B-DFlash2/snapshots/50307d4c4cde6860d4eee73e2547cd786fe8e8a4 --speculative-draft-quant fp8"
reasoning_effort = "medium"  # Template-Standard ist xhigh (sehr lange Denkphasen); low / medium / xhigh

[glm4_5-air]
# echt page: no values in checkpoint or card; Z.ai API default for the GLM-4.5 series: 0.6 / top_p 0.95
sampling = { temperature = 0.6, top_p = 0.95 }
label = "GLM-4.5-Air (NVFP4)"
group = "MoE (Offload)"
path = "models--gesong2077--GLM-4.5-Air-NVFP4/snapshots/*"
# Experten (52 GiB) ganz im RAM. Langsam -> 40k Kontext reichen; hybrid rechnet fehlende Experten auf der CPU.
# Messung 2026-10-17 (40k): offload/fp8 7,0 - offload/nvfp4 8,3 - hybrid/fp8 11,4 - hybrid/nvfp4 12,6 tok/s (85k offload/fp8: 3,6)
flags = "--kv-cache-dtype nvfp4 --moe-strategy hybrid --max-running-requests 1 --kv-reserve-tokens 40000"

[qwen3_8-flash-next]
label = "Qwen3.8 Flash-Next (NVFP4, Denken medium)"
group = "MoE (Offload)"
path = "models--RadixArk--Qwen3.8-Flash-Next-NVFP4/snapshots/*"
flags = "--kv-cache-dtype fp8 --text-model-only --ple-backend disk --cuda-graph-max-bs 1"
# alle Experten im RAM: Peak ~65 GiB RSS (2026-10-07 bei 79 GiB RAM), ~101k Kontext dank --kv-reserve-share
reasoning_effort = "medium"  # Template-Standard ist xhigh (sehr lange Denkphasen); low / medium / xhigh