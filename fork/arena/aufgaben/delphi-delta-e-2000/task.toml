title = "Delta E 2000 in Delphi"
category = "code"
level = "schwer"
summary = "Delphi-Funktion für den Farbabstand CIEDE2000 zwischen zwei RGB-Farben (sRGB -> Lab -> Delta E 2000)."
prompt = """
Schreibe mir eine Delphi-Funktion, die den Farbabstand Delta E 2000 zwischen zwei Farben berechnet.
Als Farben bekommt die Funktion zwei RGB-Werte.

Vorgaben:
- Signatur: function DeltaE2000(R1, G1, B1, R2, G2, B2: Byte): Double;
- Die RGB-Werte sind sRGB mit 8 Bit je Kanal (Weißpunkt D65). Umrechnung über XYZ nach CIELAB, danach CIEDE2000 mit kL = kC = kH = 1.
- Nur Standard-Units (z. B. SysUtils, Math), keine VCL.
- Antworte mit genau einem Codeblock (```delphi ... ```), der die Funktion und alle Hilfsfunktionen enthält, ohne Testprogramm.
"""

[check]
type = "pascal_tests"
tests = "tests.pas"

# Kompiliert die Antwort nicht, bekommt das Modell die Compilermeldungen zurück und darf bis zu 3-mal nachbessern.
# Jeder weitere Durchgang kostet 0,1 Punkte.
[retries]
max = 3
penalty = 0.1
on = ["compile"]
prompt = """
Der Code kompiliert nicht (Free Pascal im Delphi-Modus, -Mdelphi). Die Zeilennummern beziehen sich auf das Testprogramm, in das deine Funktion eingesetzt wurde; die betroffene Zeile steht jeweils darunter.

{detail}

Korrigiere den Code und antworte wieder mit genau einem Codeblock (```delphi ... ```), der die Funktion und alle Hilfsfunktionen enthält, ohne Testprogramm.
"""
