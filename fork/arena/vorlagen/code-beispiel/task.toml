title = "Palindrom prüfen"
category = "code"
level = "leicht"
summary = "ist_palindrom(): Groß-/Kleinschreibung, Leer- und Satzzeichen ignorieren."
max_tokens = 4096
prompt = """
Schreibe eine Python-Funktion `ist_palindrom(text: str) -> bool`, die prüft, ob ein Text vorwärts und rückwärts
gleich gelesen wird. Groß-/Kleinschreibung, Leerzeichen und Satzzeichen werden ignoriert, Umlaute zählen als
normale Buchstaben.

Antworte mit genau einem Python-Codeblock (```python ... ```) mit der vollständigen Lösung, ohne Testcode.
"""

[check]
type = "python_tests"
